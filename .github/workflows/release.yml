name: Release

# Push a tag like v0.1.0 to build native installers for macOS, Windows and Linux.
# Notes come from release-notes/<tag>.md. The release is published once every build succeeds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "::error::Missing $notes"; exit 1; }
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="BetterLGTM ${TAG#v}" -F body=@"$notes" -F draft=true --jq .id)
          [ -n "$id" ] || { echo "::error::Could not create the release"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Tauri downloads WiX from GitHub during bundling with no retry; fetch it up front with one.
      - name: Windows WiX tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$LOCALAPPDATA/tauri/WixTools314"
          if [ ! -f "$dir/candle.exe" ]; then
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/wix.zip" \
              https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
            mkdir -p "$dir"
            unzip -q -o "$RUNNER_TEMP/wix.zip" -d "$dir"
          fi
          ls "$dir/candle.exe" "$dir/light.exe"

      # Signs with the Developer ID certificate and notarizes with an App Store Connect API key
      # when those secrets exist; without them the macOS build stays unsigned.
      - name: macOS signing setup
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret: building an unsigned macOS app."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "MACOS_SIGNED=1"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
              echo "MACOS_NOTARIZED=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No APPLE_API_KEY_P8 secret: the app is signed but not notarized."
          fi

      # Bundling downloads WiX, NSIS and AppImage tools from GitHub, which sometimes times out.
      # Retry twice; the Rust build and any tools already downloaded are reused.
      - name: Build
        id: build1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the update bundles that installed apps download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          # latest.json is written once by publish-release, so parallel jobs can't overwrite each other.
          uploadUpdaterJson: false

      - name: Build (retry)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the update bundles that installed apps download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          # latest.json is written once by publish-release, so parallel jobs can't overwrite each other.
          uploadUpdaterJson: false

      - name: Build (second retry)
        id: build3
        if: steps.build2.outcome == 'failure'
        continue-on-error: false
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the update bundles that installed apps download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
          # latest.json is written once by publish-release, so parallel jobs can't overwrite each other.
          uploadUpdaterJson: false

      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.MACOS_SIGNED == '1'
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.rust-targets }}/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          if [ "$MACOS_NOTARIZED" = "1" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: Write latest.json for the updater
        run: python3 scripts/updater-manifest.py
      - name: Publish
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
      - name: Refresh the website's copy of latest.json
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY"
      - name: Update the Homebrew cask
        run: gh workflow run homebrew.yml -R "$GITHUB_REPOSITORY" -f tag="$TAG"
